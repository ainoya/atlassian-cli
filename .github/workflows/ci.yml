name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: probe the Zig 0.16 std API surface ahead of the migration.
  # Removed in the following commit.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Probe std API
        run: |
          set +e
          mise install zig@0.16.0
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== process: args/env =="
          grep -nE "pub (fn|const) [A-Za-z_]*[Aa]rgs[A-Za-z_]*\(|pub (fn|const) [A-Za-z_]*[Ee]nv[A-Za-z_]*" "$STD"/process.zig | head -40
          echo "== process/Environ =="
          ls "$STD"/process 2>&1 | head
          grep -nE "pub fn (get|getEnvVarOwned|hasEnvVar)" "$STD"/process/Environ.zig 2>/dev/null | head -20
          echo "== fs File open/create =="
          grep -nE "pub fn (openFileAbsolute|createFileAbsolute|cwd)\(" "$STD"/fs.zig | head -10
          echo "== File read/write =="
          grep -nE "pub fn (readToEndAlloc|writeAll|deprecatedReader|deprecatedWriter|reader|writer)\(" "$STD"/fs/File.zig | head -20
          echo "== debug.print / testing =="
          grep -nE "pub fn print\(" "$STD"/debug.zig | head -5
          grep -nE "pub fn (expectEqualStrings|refAllDecls|expectError|expect)\(" "$STD"/testing.zig | head -10
          echo "== meta.stringToEnum / fmt.parseInt =="
          grep -nE "pub fn stringToEnum\(" "$STD"/meta.zig | head -3
          grep -nE "pub fn parseInt\(" "$STD"/fmt/parse_int.zig "$STD"/fmt.zig 2>/dev/null | head -3
