name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: probe the Zig 0.16 Io/process API. Removed once the port lands.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Probe std API
        run: |
          set +e
          mise install zig@0.16.0
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== callMain =="
          grep -n "fn callMain" -A 45 "$STD"/start.zig | head -60
          echo "== Args head =="
          sed -n '1,30p' "$STD"/process/Args.zig
          echo "== Environ block consts =="
          grep -nE "pub const (global|Block|empty)|^block:" "$STD"/process/Environ.zig | head -10
          grep -nE "pub const global" "$STD"/process/Environ.zig | head -5
          echo "== Environ.getAlloc =="
          sed -n '680,700p' "$STD"/process/Environ.zig
          echo "== Dir absolute helpers =="
          grep -nE "pub fn (openFileAbsolute|writeFile|makePath)\(" "$STD"/Io/Dir.zig | head -10
          echo "== Client fields =="
          sed -n '20,45p' "$STD"/http/Client.zig
