name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: list the 0.16 Io.Dir / Io.File surface.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Probe Dir/File
        run: |
          set +e
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== Io.Dir pub fns =="
          grep -oE "^pub fn [a-zA-Z0-9_]+" "$STD"/Io/Dir.zig | sed 's/pub fn //' | sort -u | tr '\n' ' '
          echo
          echo "== Io.File pub fns =="
          grep -oE "^pub fn [a-zA-Z0-9_]+" "$STD"/Io/File.zig | sed 's/pub fn //' | sort -u | tr '\n' ' '
          echo
          echo "== File.Writer =="
          grep -nE "pub const Writer|interface" "$STD"/Io/File/Writer.zig 2>/dev/null | head -10

