name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: probe the Zig 0.16 std API surface ahead of the migration.
  # Removed in the following commit.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Probe std API
        run: |
          set +e
          mise install zig@0.16.0
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== Writer.fixed =="
          grep -n "pub fn fixed" -A 12 "$STD"/Io/Writer.zig | head -30
          echo "== Writer buffered/written =="
          grep -nE "pub fn (buffered|written|toOwnedSlice|deinit|clearRetainingCapacity)\(" "$STD"/Io/Writer.zig | head -30
          echo "== array_list writer/print =="
          grep -nE "pub fn (writer|print|appendSlice|append|deinit)\(" "$STD"/array_list.zig | head -30
          echo "== Build addModule/addExecutable/addTest =="
          grep -nE "pub fn (addModule|addExecutable|addTest|createModule|installArtifact|addRunArtifact|step)\(" "$STD"/Build.zig | head -20
          echo "== misc presence =="
          grep -nE "pub fn (parseFromSlice)\(" "$STD"/json/static.zig | head -5
          grep -nE "pub fn (argsAlloc|argsFree)\(" "$STD"/process.zig | head -5
          grep -nE "pub fn (bufPrint)\(" "$STD"/fmt.zig | head -5
          grep -nE "pub const standard\b" "$STD"/base64.zig | head -5
          echo "== BUILD AGAINST 0.16 =="
          mise exec zig@0.16.0 -- zig build --summary none 2>&1 | head -120
