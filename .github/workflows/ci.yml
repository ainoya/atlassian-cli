name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: determine the 0.16 main() parameter shape.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Probe main signature
        run: |
          set +e
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== start.zig 700-760 =="
          sed -n '700,760p' "$STD"/start.zig
          echo "== wrapMain =="
          grep -n "fn wrapMain" -A 20 "$STD"/start.zig | head -30

