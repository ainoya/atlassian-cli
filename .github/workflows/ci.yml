name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: zig version

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  # TEMPORARY: probe the Zig 0.16 std API surface ahead of the migration.
  # Removed in the following commit.
  probe-zig-016:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Probe std API
        run: |
          set +e
          mise install zig@0.16.0
          STD="$HOME/.local/share/mise/installs/zig/0.16.0/lib/std"
          echo "== Io dir =="; ls "$STD"/Io
          echo "== Io.zig File/Dir =="
          grep -nE "pub const (File|Dir|Reader|Writer)\b" "$STD"/Io.zig | head -10
          echo "== fs.zig top =="
          grep -nE "^pub (fn|const) " "$STD"/fs.zig | head -40
          echo "== Dir open/create/make =="
          grep -nE "pub fn (openFile|createFile|makePath|readFileAlloc|cwd)\(" "$STD"/fs/Dir.zig "$STD"/Io/File.zig "$STD"/Io/Dir.zig 2>/dev/null | head -20
          echo "== File methods =="
          grep -nE "pub fn (close|writeAll|readToEndAlloc|reader|writer|deprecated)" "$STD"/Io/File.zig 2>/dev/null | head -20
          echo "== process/Args =="
          grep -nE "^pub (fn|const) " "$STD"/process/Args.zig | head -20
          echo "== process/Environ =="
          grep -nE "^pub (fn|const) |^    pub fn " "$STD"/process/Environ.zig | head -40
